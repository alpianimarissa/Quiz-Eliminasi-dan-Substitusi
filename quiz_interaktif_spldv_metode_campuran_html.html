                ],
                correct: 1, // B -> if Kakak=12, Adik=8: 12+8=20. 12-8=4.
                story_context: 'Model Matematika:\n(1) x + y = 20\n(2) x - y = 4',
                step1_title: 'Langkah 1: Eliminasi variabel $y$ dengan menjumlahkan kedua persamaan:',
                step1_sub_eq: '(x + y = 20) + (x - y = 4) \\implies 2x = 24',
                step1_calc1: 'x = 12',
                step1_calc2: 'Umur Kakak = 12 tahun.',
                step1_res: 'x = 12',

                step2_title: 'Langkah 2: Substitusikan $x = 12$ ke persamaan $x + y = 20$:',
                step2_sub_eq: '12 + y = 20',
                step2_calc1: 'y = 20 - 12 = 8',
                step2_res: 'y = 8',
                final_res: 'Kakak = 12 tahun dan Adik = 8 tahun'
            },
            {
                id: 13,
                type: 'story',
                category: 'Soal Cerita',
                title: 'Soal 13',
                question: 'Di tempat parkir terdapat total $10\\text{ kendaraan}$ yang terdiri dari mobil ($x$) dan sepeda motor ($y$). Jumlah roda seluruh kendaraan tersebut adalah $32\\text{ buah}$ ($4x + 2y = 32$). Berapakah banyak mobil dan sepeda motor?',
                options: [
                    'Mobil = 5 dan Motor = 5',
                    'Mobil = 6 dan Motor = 4',
                    'Mobil = 4 dan Motor = 6',
                    'Mobil = 7 dan Motor = 3'
                ],
                correct: 1, // B -> if Mobil=6, Motor=4: 6+4=10. 4(6)+2(4) = 24+8 = 32.
                story_context: 'Model Matematika:\n(1) x + y = 10\n(2) 4x + 2y = 32 (atau disederhanakan 2x + y = 16)',
                step1_title: 'Langkah 1: Eliminasi variabel $y$ dengan mengurangkan $2x + y = 16$ dan $x + y = 10$:',
                step1_sub_eq: '(2x + y = 16) - (x + y = 10)',
                step1_calc1: 'x = 6',
                step1_calc2: 'Banyak mobil = 6.',
                step1_res: 'x = 6',

                step2_title: 'Langkah 2: Substitusikan $x = 6$ ke persamaan $x + y = 10$:',
                step2_sub_eq: '6 + y = 10',
                step2_calc1: 'y = 10 - 6 = 4',
                step2_res: 'y = 4',
                final_res: 'Mobil = 6 dan Motor = 4'
            },
            {
                id: 14,
                type: 'story',
                category: 'Soal Cerita',
                title: 'Soal 14',
                question: 'Harga $2\\text{ kaos}$ dan $1\\text{ celana}$ adalah $\\text{Rp } 250.000,00$. Harga $1\\text{ kaos}$ dan $1\\text{ celana}$ adalah $\\text{Rp } 175.000,00$. Berapakah harga $1\\text{ kaos}$ ($x$) dan $1\\text{ celana}$ ($y$)?',
                options: [
                    'Kaos = Rp 75.000,00 dan Celana = Rp 100.000,00',
                    'Kaos = Rp 80.000,00 dan Celana = Rp 95.000,00',
                    'Kaos = Rp 70.000,00 dan Celana = Rp 105.000,00',
                    'Kaos = Rp 85.000,00 dan Celana = Rp 90.000,00'
                ],
                correct: 0, // A -> if Kaos=75k, Celana=100k: 2(75k)+100k = 250k. 75k+100k = 175k.
                story_context: 'Model Matematika:\n(1) 2x + y = 250.000\n(2) x + y = 175.000',
                step1_title: 'Langkah 1: Eliminasi variabel $y$ dengan mengurangkan kedua persamaan:',
                step1_sub_eq: '(2x + y = 250.000) - (x + y = 175.000)',
                step1_calc1: 'x = 75.000',
                step1_calc2: 'Harga 1 kaos = Rp 75.000,00.',
                step1_res: 'x = 75.000',

                step2_title: 'Langkah 2: Substitusikan $x = 75.000$ ke persamaan $x + y = 175.000$:',
                step2_sub_eq: '75.000 + y = 175.000',
                step2_calc1: 'y = 175.000 - 75.000 = 100.000',
                step2_res: 'y = 100.000',
                final_res: 'Kaos = Rp 75.000,00 dan Celana = Rp 100.000,00'
            },
            {
                id: 15,
                type: 'story',
                category: 'Soal Cerita',
                title: 'Soal 15',
                question: 'Jumlah dua bilangan adalah $30$, sedangkan selisih kedua bilangan tersebut adalah $10$ ($x - y = 10$). Tentukan kedua bilangan tersebut ($x$ dan $y$)!',
                options: [
                    '18 dan 12',
                    '19 dan 11',
                    '20 dan 10',
                    '21 dan 9'
                ],
                correct: 2, // C -> if 20 and 10: sum = 30, diff = 10.
                story_context: 'Model Matematika:\n(1) x + y = 30\n(2) x - y = 10',
                step1_title: 'Langkah 1: Eliminasi variabel $y$ dengan menjumlahkan kedua persamaan:',
                step1_sub_eq: '(x + y = 30) + (x - y = 10) \\implies 2x = 40',
                step1_calc1: 'x = 20',
                step1_calc2: 'Bilangan pertama = 20.',
                step1_res: 'x = 20',

                step2_title: 'Langkah 2: Substitusikan $x = 20$ ke persamaan $x + y = 30$:',
                step2_sub_eq: '20 + y = 30',
                step2_calc1: 'y = 30 - 20 = 10',
                step2_res: 'y = 10',
                final_res: 'Kedua bilangan tersebut adalah 20 dan 10'
            }
        ];

        // App State
        let currentIdx = 0;
        let userAnswers = {}; // { qId: selectedOptionIndex }
        let currentFilter = 'all';

        // LocalStorage keys
        const STORAGE_KEY = 'spldv_mixed_method_quiz_state_v1';

        // Load saved state from localStorage (Anti-reload / Offline protection)
        function loadSavedState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    userAnswers = parsed.userAnswers || {};
                    if (typeof parsed.currentIdx === 'number' && parsed.currentIdx >= 0 && parsed.currentIdx < 15) {
                        currentIdx = parsed.currentIdx;
                    }
                }
            } catch (e) {
                console.warn('LocalStorage error:', e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    userAnswers: userAnswers,
                    currentIdx: currentIdx
                }));
            } catch (e) {
                console.warn('LocalStorage save error:', e);
            }
        }

        function resetQuiz() {
            if (confirm('Apakah Anda yakin ingin mengulang kuis dari awal? Semua jawaban Anda akan dihapus.')) {
                userAnswers = {};
                currentIdx = 0;
                localStorage.removeItem(STORAGE_KEY);
                renderAll();
            }
        }

        // Render Navigation Grid
        function renderNavGrid() {
            const gridEl = document.getElementById('nav-grid');
            gridEl.innerHTML = '';

            quizData.forEach((q, idx) => {
                // Check category filter
                if (currentFilter === 'direct' && q.type !== 'direct') return;
                if (currentFilter === 'story' && q.type !== 'story') return;

                const btn = document.createElement('button');
                btn.className = `h-10 rounded-xl font-bold text-xs sm:text-sm flex flex-col items-center justify-center transition-all relative border`;

                const isCurrent = (idx === currentIdx);
                const hasAnswered = (userAnswers[q.id] !== undefined);
                const isCorrect = hasAnswered && (userAnswers[q.id] === q.correct);

                if (!hasAnswered) {
                    btn.classList.add('bg-slate-100', 'text-slate-700', 'border-slate-300', 'hover:bg-fuchsia-100');
                } else if (isCorrect) {
                    btn.classList.add('bg-emerald-500', 'text-white', 'border-emerald-600', 'shadow-sm');
                } else {
                    btn.classList.add('bg-rose-500', 'text-white', 'border-rose-600', 'shadow-sm');
                }

                if (isCurrent) {
                    btn.classList.add('ring-4', 'ring-fuchsia-400', 'ring-offset-1', 'scale-105', 'z-10');
                }

                btn.innerText = `${idx + 1}`;
                btn.onclick = () => {
                    currentIdx = idx;
                    saveState();
                    renderAll();
                };

                gridEl.appendChild(btn);
            });
        }

        // Render Step Block
        function renderStepBlock(title, subEq, calc1, calc2, res) {
            return `
                <div class="bg-white/90 p-4 sm:p-5 rounded-xl border border-fuchsia-200 space-y-2 font-mono text-xs sm:text-sm">
                    <p class="font-sans font-bold text-fuchsia-950 border-b border-fuchsia-100 pb-2">
                        ${title}
                    </p>
                    <div class="space-y-1.5 text-slate-800 pt-1">
                        <div class="font-bold text-fuchsia-900 bg-fuchsia-50 p-2 rounded border border-fuchsia-200">
                            &bull; $${subEq}$
                        </div>
                        <div>&bull; ${calc1}</div>
                        <div>&bull; ${calc2}</div>
                        <div class="text-base sm:text-lg font-bold text-emerald-700 pt-1">
                            &rArr; ${res}
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Active Question
        function renderQuestionCard() {
            const q = quizData[currentIdx];
            const cardEl = document.getElementById('question-card');
            const userChoice = userAnswers[q.id];
            const isAnswered = (userChoice !== undefined);

            const optLabels = ['A', 'B', 'C', 'D'];

            let html = `
                <!-- Question Header Banner -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-fuchsia-200 pb-3">
                    <div class="flex items-center gap-2">
                        <span class="px-2.5 py-1 bg-fuchsia-600 text-white font-bold text-xs rounded-lg">
                            ${q.category}
                        </span>
                        <h2 class="text-lg font-bold text-fuchsia-950">${q.title}</h2>
                    </div>
                    ${isAnswered ? (
                        userChoice === q.correct ? 
                        `<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full border border-emerald-300 flex items-center gap-1.5 w-max">
                            <i class="fa-solid fa-circle-check text-emerald-600"></i> Jawaban Benar!
                         </span>` : 
                        `<span class="bg-rose-100 text-rose-800 text-xs font-bold px-3 py-1 rounded-full border border-rose-300 flex items-center gap-1.5 w-max">
                            <i class="fa-solid fa-circle-xmark text-rose-600"></i> Kurang Tepat
                         </span>`
                    ) : ''}
                </div>

                <!-- Story Context (if any) -->
                ${q.story_context ? `
                    <div class="p-3.5 bg-fuchsia-100/70 border border-fuchsia-300 rounded-xl text-xs sm:text-sm font-medium text-fuchsia-950 font-mono space-y-1">
                        <div class="font-bold text-fuchsia-950 font-sans uppercase text-xs flex items-center gap-1">
                            <i class="fa-solid fa-lightbulb text-fuchsia-600"></i> Informasi & Model Matematika:
                        </div>
                        <div class="whitespace-pre-line">${q.story_context}</div>
                    </div>
                ` : ''}

                <!-- Question Text -->
                <div class="text-base sm:text-lg text-slate-800 font-medium whitespace-pre-line leading-relaxed">
                    ${q.question}
                </div>

                <!-- 4 Options Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
            `;

            q.options.forEach((optText, optIdx) => {
                let btnStyle = "bg-white border-fuchsia-300 hover:bg-fuchsia-50 text-slate-800";
                let badgeStyle = "bg-fuchsia-100 text-fuchsia-900 border-fuchsia-300";

                if (isAnswered) {
                    if (optIdx === q.correct) {
                        btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-950 font-bold ring-2 ring-emerald-400";
                        badgeStyle = "bg-emerald-500 text-white border-emerald-600";
                    } else if (optIdx === userChoice) {
                        btnStyle = "bg-rose-100 border-rose-500 text-rose-950 font-medium ring-2 ring-rose-400";
                        badgeStyle = "bg-rose-500 text-white border-rose-600";
                    } else {
                        btnStyle = "bg-gray-50 border-gray-200 text-gray-400 opacity-60";
                        badgeStyle = "bg-gray-200 text-gray-500 border-gray-300";
                    }
                }

                html += `
                    <button onclick="selectOption(${optIdx})" ${isAnswered ? 'disabled' : ''} class="p-4 rounded-xl border text-left text-xs sm:text-sm font-medium transition-all flex items-start gap-3 shadow-sm ${btnStyle}">
                        <span class="w-7 h-7 rounded-lg border font-bold flex items-center justify-center shrink-0 ${badgeStyle}">
                            ${optLabels[optIdx]}
                        </span>
                        <span class="mt-1">${optText}</span>
                    </button>
                `;
            });

            html += `</div>`;

            // If Answered, show detailed step-by-step mixed method solution
            if (isAnswered) {
                html += `
                    <div class="mt-6 pt-6 border-t border-fuchsia-200 space-y-4">
                        <div class="flex items-center gap-2 text-sm font-bold text-fuchsia-950 uppercase">
                            <i class="fa-solid fa-align-left text-fuchsia-600"></i> Pembahasan Langkah Metode Campuran:
                        </div>

                        <div class="paper-card p-5 sm:p-7 rounded-2xl border-2 border-dashed border-fuchsia-300 shadow-sm space-y-4">
                            ${renderStepBlock(q.step1_title, q.step1_sub_eq, q.step1_calc1, q.step1_calc2, q.step1_res)}
                            ${renderStepBlock(q.step2_title, q.step2_sub_eq, q.step2_calc1, q.step2_calc1, q.step2_res)}

                            <!-- Final Result Banner -->
                            <div class="p-3.5 bg-fuchsia-100 rounded-xl border border-fuchsia-300 text-center font-bold text-fuchsia-950 text-sm sm:text-base">
                                Kesimpulan Himpunan Penyelesaian: <span class="underline text-rose-700 ml-1">${q.final_res}</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            cardEl.innerHTML = html;

            // Trigger MathJax typeset
            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        // Handle Option Selection
        function selectOption(optIdx) {
            const q = quizData[currentIdx];
            if (userAnswers[q.id] !== undefined) return; // already answered

            userAnswers[q.id] = optIdx;
            saveState();
            renderAll();
        }

        // Update Header Counter
        function updateScoreboard() {
            let answered = 0;
            let score = 0;

            quizData.forEach(q => {
                if (userAnswers[q.id] !== undefined) {
                    answered++;
                    if (userAnswers[q.id] === q.correct) {
                        score++;
                    }
                }
            });

            document.getElementById('answered-count').innerText = `${answered}`;
            document.getElementById('score-count').innerText = `${score}`;

            // Update Bottom Indicators
            document.getElementById('question-indicator').innerText = `Soal ${currentIdx + 1} dari ${quizData.length}`;
            document.getElementById('btn-prev').disabled = (currentIdx === 0);
            document.getElementById('btn-prev').classList.toggle('opacity-50', currentIdx === 0);
            
            document.getElementById('btn-next').disabled = (currentIdx === quizData.length - 1);
            document.getElementById('btn-next').classList.toggle('opacity-50', currentIdx === quizData.length - 1);
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                saveState();
                renderAll();
            }
        }

        function nextQuestion() {
            if (currentIdx < quizData.length - 1) {
                currentIdx++;
                saveState();
                renderAll();
            }
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('[id^="filter-"]').forEach(btn => {
                btn.className = "px-2.5 py-1 rounded-lg bg-fuchsia-100 text-fuchsia-950 hover:bg-fuchsia-200 font-medium";
            });
            document.getElementById(`filter-${cat}`).className = "px-2.5 py-1 rounded-lg bg-fuchsia-600 text-white font-medium shadow-sm";
            renderNavGrid();
        }

        function renderAll() {
            renderNavGrid();
            renderQuestionCard();
            updateScoreboard();
        }

        // Initial Load
        window.onload = function() {
            loadSavedState();
            renderAll();
        };
    </script>
</body>
</html>
